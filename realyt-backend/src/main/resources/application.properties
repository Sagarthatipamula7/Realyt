server.port=8081

spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DATABASE_NAME:realyt}
spring.datasource.username=${DATABASE_USER:postgres}
spring.datasource.password=${DATABASE_PASSWORD:postgres}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.show-sql=false

jwt.secret=${JWT_SECRET:3a8f9d2b7c4e1f5a9b6c3d2e7f8a1b0c4e1f5a9b6c3d2e7f8a1b0c4e1f5a9b6c}
jwt.expiration-ms=3600000

logging.level.org.springframework=INFO
logging.level.com.realyt=DEBUG
